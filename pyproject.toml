[project]
name = "probe-station"
version = "0.1.0"
description = "Tkinter GUI for a three-axis automated probe station."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "pyserial",
]

[project.scripts]
probe-station = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "app_gui",
    "camera_opencv",
    "focus_metrics",
    "gui_app",
    "image_stitcher",
    "main",
    "main_stage1_manual",
    "main_stage2_focus_assist",
    "main_stage3_autofocus",
    "sample_plane",
    "scan_plan",
    "stage_controller",
    "stage_protocol",
    "stitching_store",
    "stitching_calibration",
    "stitching_view_model",
]
